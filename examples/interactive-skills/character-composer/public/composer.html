<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>人物组合器</title>
  <style>
    :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --bg:#f6f7f8; --panel:#e9edef; --ink:#182029; --muted:#657180; --accent:#176b57; --line:rgba(87,101,116,.22); }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:var(--bg); color:var(--ink); }
    body { padding:clamp(12px,2vw,24px); }
    main { width:min(1120px,100%); margin:0 auto; }
    header { display:flex; align-items:end; justify-content:space-between; gap:18px; margin:4px 0 18px; }
    h1 { margin:0; font-size:clamp(24px,4vw,42px); line-height:1; letter-spacing:-.04em; }
    header p { max-width:38ch; margin:0; color:var(--muted); font-size:13px; line-height:1.45; }
    .stage { display:grid; grid-template-columns:minmax(260px,1.25fr) minmax(300px,.75fr); gap:14px; }
    .preview { position:relative; min-height:520px; margin:0; overflow:hidden; border-radius:14px; background:#dfe4e7; border:1px solid var(--line); }
    .preview-grid { display:grid; grid-template-columns:1.15fr .85fr; grid-template-rows:repeat(3,1fr); gap:2px; min-height:520px; }
    .preview-grid img { width:100%; height:100%; min-height:0; display:block; object-fit:cover; background:#cfd6da; }
    .preview-grid img:first-child { grid-row:span 2; }
    .preview figcaption { position:absolute; left:12px; right:12px; bottom:12px; padding:10px 12px; border-radius:9px; background:rgba(20,27,34,.82); color:#f5faf8; font-size:12px; backdrop-filter:blur(8px); }
    .controls { display:flex; flex-direction:column; gap:8px; }
    .selector { display:grid; grid-template-columns:1fr auto; align-items:center; gap:12px; min-height:78px; padding:12px 12px 12px 15px; border:1px solid var(--line); border-radius:12px; background:var(--panel); }
    .selector strong { display:block; font-size:14px; }
    .selector span { color:var(--muted); font-variant-numeric:tabular-nums; font-size:12px; }
    .stepper { display:flex; align-items:center; gap:7px; }
    button { min-width:40px; min-height:40px; border-radius:9px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font:inherit; font-weight:650; cursor:pointer; }
    button:active { transform:translateY(1px); }
    button:focus-visible,textarea:focus-visible { outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent); outline-offset:2px; }
    textarea { width:100%; min-height:76px; resize:vertical; border:1px solid var(--line); border-radius:12px; padding:12px; background:var(--bg); color:var(--ink); font:inherit; line-height:1.45; }
    label.note { display:grid; gap:7px; color:var(--muted); font-size:12px; }
    .submit { width:100%; min-height:48px; border:0; background:var(--accent); color:#f5fffb; }
    .submit[disabled] { opacity:.55; cursor:wait; }
    #status { min-height:18px; margin:0; color:var(--muted); font-size:12px; }
    @media (max-width:760px) { body{padding:12px;} header{display:block;} header p{margin-top:8px;} .stage{grid-template-columns:1fr;} .preview,.preview-grid{min-height:46dvh;} .controls{padding-bottom:max(8px,env(safe-area-inset-bottom));} }
    @media (prefers-color-scheme:dark) { :root{--bg:#151b20;--panel:#20282f;--ink:#edf2f4;--muted:#aab4bd;--accent:#3d9c80;--line:rgba(190,204,214,.2);} .preview{background:#252e34;} }
    @media (prefers-reduced-motion:reduce) { *{scroll-behavior:auto!important;} }
  </style>
</head>
<body>
  <main>
    <header><h1>组合你想要的人物</h1><p>一次只看一个选择。切换局部，保留整体感觉，满意后交给 Codex 生成。</p></header>
    <section class="stage">
      <figure class="preview"><div class="preview-grid" id="previewGrid"></div><figcaption id="caption"></figcaption></figure>
      <div class="controls" id="controls"></div>
    </section>
  </main>
  <script type="module">
    const ASSET_BASE = '__ASSET_BASE_URL__';
    const categories = [
      ['face','样貌'], ['faceShape','脸型'], ['hair','发型'], ['outfit','衣着'], ['body','身材']
    ];
    const selection = Object.fromEntries(categories.map(([key]) => [key,0]));
    const pending = new Map();
    let rpcId = 0;
    let busy = false;
    let note = '';
    let preloadTimer;
    const controls = document.querySelector('#controls');
    const previewGrid = document.querySelector('#previewGrid');
    const caption = document.querySelector('#caption');

    const assetUrl = (key,index) => `${ASSET_BASE}/seed/hapla-${key}-${index + 1}/900/1100`;
    const rpcRequest = (method,params) => new Promise((resolve,reject) => {
      const id = ++rpcId; pending.set(id,{resolve,reject});
      parent.postMessage({jsonrpc:'2.0',id,method,params},'*');
    });
    const rpcNotify = (method,params) => parent.postMessage({jsonrpc:'2.0',method,params},'*');

    function preloadAdjacent() {
      clearTimeout(preloadTimer);
      const images = [];
      for (const [key] of categories) for (const offset of [-1,1]) {
        const image = new Image();
        image.src = assetUrl(key,(selection[key] + offset + 40) % 40);
        images.push(image);
      }
      preloadTimer = setTimeout(() => images.forEach(image => { image.src = ''; }),10000);
    }

    function render() {
      note = document.querySelector('#note')?.value ?? note;
      controls.innerHTML = '';
      for (const [key,label] of categories) {
        const row = document.createElement('div'); row.className = 'selector';
        row.innerHTML = `<div><strong>${label}</strong><span>${selection[key] + 1} / 40</span></div><div class="stepper"><button type="button" data-key="${key}" data-step="-1" aria-label="上一个${label}">‹</button><button type="button" data-key="${key}" data-step="1" aria-label="下一个${label}">›</button></div>`;
        controls.appendChild(row);
      }
      controls.insertAdjacentHTML('beforeend','<label class="note">补充要求<textarea id="note" placeholder="例如：自然光、全身构图、写实风格"></textarea></label><button id="submit" class="submit" type="button">生成组合图</button><p id="status" aria-live="polite"></p>');
      document.querySelector('#note').value = note;
      previewGrid.replaceChildren(...categories.map(([key,label]) => {
        const image = new Image(); image.src = assetUrl(key,selection[key]); image.alt = `${label}参考 ${selection[key] + 1}`; return image;
      }));
      caption.textContent = categories.map(([key,label]) => `${label} ${selection[key] + 1}`).join('  /  ');
      preloadAdjacent();
    }

    controls.addEventListener('click',async event => {
      const step = event.target.closest('[data-step]');
      if (step) { const key=step.dataset.key; selection[key]=(selection[key]+Number(step.dataset.step)+40)%40; render(); return; }
      if (event.target.id !== 'submit' || busy) return;
      busy = true; event.target.disabled = true;
      document.querySelector('#status').textContent = '已提交，Codex 将在主会话中继续。';
      const images = categories.map(([key]) => assetUrl(key,selection[key]));
      const note = document.querySelector('#note').value.trim();
      const summary = categories.map(([key,label]) => `${label}选择 ${selection[key] + 1}`).join('，');
      try {
        await rpcRequest('hapla/submit',{ text:`请使用我提交的五张参考图生成一个完整人物。${summary}。${note}`, images, skill:{name:'imagegen'} });
      } catch (error) {
        document.querySelector('#status').textContent = error?.message || '提交失败，请稍后重试。';
        busy = false; event.target.disabled = false;
      }
    });

    addEventListener('message',event => {
      if (event.source !== parent || event.data?.jsonrpc !== '2.0') return;
      const message = event.data;
      if (message.id !== undefined && pending.has(message.id)) {
        const request = pending.get(message.id); pending.delete(message.id);
        message.error ? request.reject(message.error) : request.resolve(message.result); return;
      }
      if (message.method === 'ui/notifications/tool-input') Object.assign(selection,message.params || {});
      if (message.method === 'ui/notifications/tool-input' || message.method === 'ui/notifications/tool-result') render();
    },{passive:true});

    await rpcRequest('ui/initialize',{appInfo:{name:'character-composer',version:'0.1.0'},appCapabilities:{},protocolVersion:'2026-01-26'});
    rpcNotify('ui/notifications/initialized',{});
    render();
  </script>
</body>
</html>
