name: Bug report
description: Report a reproducible problem in Hapla.
body:
  - type: markdown
    attributes:
      value: For vulnerabilities, follow SECURITY.md. Remove credentials, signed URLs, and private conversation data from all reports.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Hapla revision, OS, Node/pnpm versions, browser, agent CLI version, and deployment method.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal example using an isolated account or workspace.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized logs or screenshots if useful.
    validations:
      required: true
