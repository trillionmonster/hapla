# Docker may start Web before the relay and assign new IPs after a reboot.
# Resolve the service name at runtime so neither event requires a manual restart.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 5s;

upstream hapla_relay {
    zone hapla_relay 64k;
    server server:3005 resolve;
}

map $http_x_forwarded_proto $hapla_forwarded_proto {
    default $scheme;
    "~^https(?:,|$)" https;
    "~^http(?:,|$)" http;
}

map $http_x_forwarded_host $hapla_forwarded_host {
    default $http_host;
    "~^(?<hapla_original_host>[^,]+)" $hapla_original_host;
}

map "$uri:$http_referer" $hapla_preview_redirect {
    default "";
    ~^/preview/ "";
    "~^/[^:]*:https?://[^/]+/preview/([a-f0-9]{32})(?:/|$)" /preview/$1;
}

server {
    listen 80;
    # Keep the browser's external scheme and port across TLS/port forwarders.
    # Nginx otherwise expands local redirects using this container's port 80.
    absolute_redirect off;
    if ($hapla_preview_redirect != "") { return 307 $hapla_preview_redirect$request_uri; }
    server_name _;
    client_max_body_size 100m;
    root /usr/share/nginx/html;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/wasm;

    # Documents and app assets need the outer password cookie. Only the exact
    # public brand files below are available on the password page. API clients
    # retain their own verified bearer/Socket.IO authentication.
    auth_request /_hapla_access_check;

    location ~ ^/brand/(hapla-favicon-v1\.svg|hapla-favicon-active-v1\.svg|hapla-icon-180-v1\.png|hapla-icon-192-v1\.png|hapla-icon-512-v1\.png|hapla-v1\.webmanifest)$ {
        auth_request off;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        types {
            image/svg+xml svg;
            image/png png;
            application/manifest+json webmanifest;
        }
        try_files $uri =404;
    }

    location = /favicon.ico {
        auth_request off;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /_hapla_access_check {
        internal;
        auth_request off;
        proxy_pass http://hapla_relay/access/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
    }

    location ~ ^/access/(login|check)$ {
        auth_request off;
        client_max_body_size 4k;
        proxy_pass http://hapla_relay;
        proxy_set_header Host $hapla_forwarded_host;
        proxy_set_header X-Forwarded-Host $hapla_forwarded_host;
        proxy_set_header X-Forwarded-Proto $hapla_forwarded_proto;
        proxy_set_header X-Hapla-Return-To "";
    }

    location @hapla_access_login {
        auth_request off;
        proxy_pass http://hapla_relay;
        rewrite ^ /access/login break;
        proxy_set_header Host $hapla_forwarded_host;
        proxy_set_header X-Forwarded-Host $hapla_forwarded_host;
        proxy_set_header X-Hapla-Return-To $request_uri;
        proxy_set_header X-Forwarded-Proto $hapla_forwarded_proto;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # CLI-to-cache source transport is authenticated by the API. Stream through
    # the proxy without staging multi-gigabyte bodies on its local disk.
    location ~ "^/v1/files/(cloud|direct)/[a-f0-9]{64}/source$" {
        auth_request off;
        client_max_body_size 8g;
        client_body_timeout 3700s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $hapla_forwarded_host;
        proxy_set_header X-Forwarded-Host $hapla_forwarded_host;
        proxy_set_header X-Forwarded-Proto $hapla_forwarded_proto;
        proxy_pass http://hapla_relay;
    }

    # Account/key-authenticated development pages and HMR/WebSocket streams.
    location ^~ /preview/ {
        auth_request off;
        proxy_pass http://hapla_relay;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $hapla_forwarded_host;
        proxy_set_header X-Forwarded-Host $hapla_forwarded_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $hapla_forwarded_proto;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # NAS restore waits for the original to become ready, up to one hour.
    location = /v1/files/cloud/resolve {
        auth_request off;
        client_max_body_size 20k;
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;
        proxy_buffering off;
        proxy_set_header Host $hapla_forwarded_host;
        proxy_set_header X-Forwarded-Host $hapla_forwarded_host;
        proxy_set_header X-Forwarded-Proto $hapla_forwarded_proto;
        proxy_pass http://hapla_relay;
    }

    # An owned attachment download may restore an evicted R2 object first.
    location ^~ /files/ {
        auth_request off;
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;
        proxy_buffering off;
        proxy_set_header Host $hapla_forwarded_host;
        proxy_set_header X-Forwarded-Host $hapla_forwarded_host;
        proxy_set_header X-Forwarded-Proto $hapla_forwarded_proto;
        proxy_pass http://hapla_relay;
    }

    location ~ ^/(v1|v2|v3|files|socket\.io|health)(/|$) {
        auth_request off;
        proxy_pass http://hapla_relay;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $hapla_forwarded_host;
        proxy_set_header X-Forwarded-Host $hapla_forwarded_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $hapla_forwarded_proto;
    }

    location ~ "^/_expo/static-[a-f0-9]{16}/" {
        add_header Cache-Control "private, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /_expo/static/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Fonts share the static asset cache and password gate. Only uncompressed
    # font formats need gzip; WOFF/WOFF2 already contain compressed tables.
    location ~* ^/assets/.+\.(ttf|otf|woff|woff2)$ {
        types {
            font/ttf ttf;
            font/otf otf;
            font/woff woff;
            font/woff2 woff2;
        }
        gzip_types font/ttf font/otf;
        add_header Cache-Control "private, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "private, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        error_page 401 = @hapla_access_login;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
